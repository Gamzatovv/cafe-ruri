# Replace YOUR_DOMAIN.RU with your real domain before production.
# The HTTP server also serves ACME challenges for Let's Encrypt.
server {
  listen 80;
  server_name roori.ru www.roori.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/admin/login {
    limit_req zone=admin_login burst=3 nodelay;
    proxy_pass http://ruri_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    limit_req zone=public_api burst=20 nodelay;
    proxy_pass http://ruri_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Admin-Password $http_x_admin_password;
  }

  location / {
    proxy_pass http://ruri_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

